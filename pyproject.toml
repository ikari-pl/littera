[project]
name = "littera"
version = "0.0.0"
description = "Literature meets refactoring"
requires-python = ">=3.11"

dependencies = [
  "psycopg>=3",
  "typer>=0.9",
  "rich>=13",
  "PyYAML>=6",
  "textual>=0.50",
  "inflect>=7",
]

[project.scripts]
littera = "littera.cli.app:app"

[project.optional-dependencies]
# A fresh checkout could not run the suite: neither pytest nor ruff was declared.
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.mypy]
disable_error_code = [
    "attr-defined",
    "assignment",
    "call-arg",
    "operator",
    "return-value",
]

[tool.pyright]
strict = ["type-check", "reportUnusedFunction"]
reportMissingTypeStubs = "error"
reportUnsupportedType = "error"
reportInconsistentMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportUntypedFunctionDefinition = "error"
littera = "littera.cli.app:app"

[tool.setuptools.package-data]
"littera.linguistics" = ["data/*.db"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"

# Rule selection is intentionally left at ruff's defaults. Enabling the full
# E/S/B sets surfaces ~130 further findings (long lines, SQL-string warnings,
# subprocess use in tests); that is a worthwhile cleanup but a separate task.
